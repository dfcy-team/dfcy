            'ghcr.io/dfcy-team/dfcy/saas-collab-frontend@sha256:de99b6e2e1dcebf6079ad20b3af25a24004feaae4a43279c3f538f08cd9aefa8'
          )
          if (($actualFields -join ',') -ne ($expectedFields -join ',') -or
              $r.status -ne 'cache_only_complete' -or $r.workflow_run_id -ne 40515060731 -or
