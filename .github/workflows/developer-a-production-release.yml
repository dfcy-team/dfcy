              $cacheActionMatches.Count -ne 1 -or $cacheActionMatches[0].status -ne 'completed' -or
              $cacheActionMatches[0].conclusion -ne 'success' -or -not $cacheActionMatches[0].completed_at) {
            throw 'V316 cache proof run required jobs did not succeed.'
          }
