          try {
            $precacheRun = Invoke-RestMethod -Method Get -Uri $precacheBase -Headers $headers
            $precacheJobs = Invoke-RestMethod -Method Get -Uri "$precacheBase/jobs?per_page=100" -Headers $headers
          } catch { throw 'Unable to verify the V316 cache proof run.' }
          if ($precacheRun.path -ne '.github/workflows/developer-a-production-release.yml' -or
              $precacheRun.event -ne 'workflow_dispatch' -or $precacheRun.head_branch -ne 'main' -or
              $precacheRun.status -ne 'completed' -or $precacheRun.conclusion -ne 'success' -or
              $precacheRun.head_sha -ne $env:GITHUB_SHA -or $precacheRun.run_attempt -ne 1) { throw 'V316 cache proof run identity is invalid.' }
          $cacheJobRows = @($precacheJobs.jobs)
          if ($precacheJobs.total_count -ne $cacheJobRows.Count -or $cacheJobRows.Count -eq 0) { throw 'V316 cache proof job listing is incomplete.' }
          foreach ($job in $cacheJobRows) {
            if ($job.status -ne 'completed') { throw 'V316 cache proof run has a nonterminal job.' }
          }
          $cacheValidateMatches = @($cacheJobRows | Where-Object { $_.name -eq 'Validate requested release' })
          $cacheActionMatches = @($cacheJobRows | Where-Object { $_.name -eq 'Cache exact V316 attempt-2 images (no deployment)' })
          if ($cacheValidateMatches.Count -ne 1 -or $cacheValidateMatches[0].status -ne 'completed' -or
