            }
            $cacheProcess = [Diagnostics.Process]::Start($cacheSsh)
            $stdoutTask = $cacheProcess.StandardOutput.ReadToEndAsync()
            $stderrTask = $cacheProcess.StandardError.ReadToEndAsync()
            $tokenBytes = [Text.Encoding]::UTF8.GetBytes($env:GHCR_TOKEN)
            $cacheProcess.StandardInput.BaseStream.Write($tokenBytes, 0, $tokenBytes.Length)
            $cacheProcess.StandardInput.Close()
            $cacheProcess.WaitForExit()
            $receiptText = $stdoutTask.GetAwaiter().GetResult()
            [void]$stderrTask.GetAwaiter().GetResult()
            if ($cacheProcess.ExitCode -ne 0) {
              & $receiptHelper -Path $diagnostic -Stage cache -Reason ssh_exit_nonzero -ExitCode $cacheProcess.ExitCode -RunId $env:GITHUB_RUN_ID -Attempt $env:GITHUB_RUN_ATTEMPT -ReleaseSha 'f9827a0a89b622997f1c2633411ec9ef2758839a' -ControllerSha $env:GITHUB_SHA
              throw 'V316 cache-only operation failed.'
            }
            $receiptLines = @($receiptText)
            if ($receiptLines.Count -ne 1 -or [string]$receiptLines[0] -notmatch '^\{.*\}$') { throw 'V316 cache proof output is not a single JSON record.' }
            try { $r = $receiptText | ConvertFrom-Json } catch { throw 'V316 cache proof is invalid.' }
            $expectedImages = @(
              'ghcr.io/dfcy-team/dfcy/saas-collab-backend@sha256:6a943d02b598a7033a24f9c94ef8ed9d5580acaccc13143b6650e74de2669236',
              'ghcr.io/dfcy-team/dfcy/saas-collab-frontend@sha256:de99b6e2e1dcebf6079ad20b3af25a24004feaae4a43279c3f538f08cd9aefa8'
            )
            if ($r.status -ne 'cache_only_complete' -or $r.workflow_run_id -ne 40515060731 -or $r.attempt -ne 2 -or
                $r.release_sha -ne 'f9827a0a89b622997f1c2633411ec9ef2758839a' -or
                $r.release_controller_sha -ne 'fb20a0adb932e07c7d206d05807b80c80076696f' -or
                $r.cache_controller_sha -ne $env:GITHUB_SHA -or
                $r.manifest_sha256 -ne '3d437f40b274a4e12846691c31337bc69f052f31d344cfb9aba7869cd952097d' -or
                $r.pull_count -ne 2 -or (($r.images -join ',') -ne ($expectedImages -join ',')) -or
                @($r.log_sha256).Count -ne 2 -or @($r.log_sha256 | Where-Object { $_ -notmatch '^[0-9a-f]{64}$' }).Count -ne 0) {
              throw 'V316 cache proof does not match the fixed images and release.'
            }
            $proof = [ordered]@{
              status = $r.status
              workflow_run_id = $r.workflow_run_id
              attempt = $r.attempt
              cache_workflow_run_id = [long]$env:GITHUB_RUN_ID
              cache_run_attempt = [int]$env:GITHUB_RUN_ATTEMPT
              release_sha = $r.release_sha
              release_controller_sha = $r.release_controller_sha
              cache_controller_sha = $r.cache_controller_sha
              manifest_sha256 = $r.manifest_sha256
              pull_count = $r.pull_count
              images = @($r.images)
              log_sha256 = @($r.log_sha256)
            }
            [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'v316-precache-receipt.json'), ($proof | ConvertTo-Json -Compress), [Text.UTF8Encoding]::new($false))
          } catch {
            if (-not (Test-Path -LiteralPath $diagnostic)) { & $receiptHelper -Path $diagnostic -Stage cache -Reason unknown -RunId $env:GITHUB_RUN_ID -Attempt $env:GITHUB_RUN_ATTEMPT -ReleaseSha 'f9827a0a89b622997f1c2633411ec9ef2758839a' -ControllerSha $env:GITHUB_SHA }
            throw
          } finally { Remove-Item -LiteralPath $key,$knownHosts -Force -ErrorAction SilentlyContinue }
      - name: Preserve sanitized V316 cache proof
        uses: actions/upload-artifact@v4
        with:
          name: production-v316-precache-receipt
          path: v316-precache-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve sanitized cache failure receipt
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-cache-diagnostic
          path: production-failure-receipt.json
          if-no-files-found: ignore
          retention-days: 30

  deploy-v316-manifest-reuse:
    name: Deploy exact V316 manifest without rebuilding
    needs: validate
    if: needs.validate.outputs.action == 'deploy-v316-manifest-reuse' && needs.validate.outputs.transport == 'ssh'
    environment: Production
    runs-on: ${{ vars.PRODUCTION_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      VM_HOST: ${{ vars.VM_HOST }}
      VM_PORT: ${{ vars.VM_PORT }}
      VM_DEPLOY_USER: ${{ vars.VM_DEPLOY_USER }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.PRODUCTION_GHCR_PULL_TOKEN || github.token }}
      GH_API_TOKEN: ${{ github.token }}
      REGISTRY_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize sanitized failure receipt
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/saas-collab-system/deploy/production-control/ci/write_failure_receipt.ps1" -Path "$env:GITHUB_WORKSPACE/production-failure-receipt.json" -Stage reuse -Reason unknown -RunId $env:GITHUB_RUN_ID -Attempt $env:GITHUB_RUN_ATTEMPT -ControllerSha $env:GITHUB_SHA
      - name: Verify fixed source run and its successful gates
        id: precache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_API_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $base = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/40515060731"
