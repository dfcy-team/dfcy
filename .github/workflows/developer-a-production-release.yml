            $run = Invoke-RestMethod -Method Get -Uri $base -Headers $headers
            $jobs = Invoke-RestMethod -Method Get -Uri "$base/jobs?per_page=100" -Headers $headers
          } catch { throw 'Unable to verify the fixed V316 source run.' }
          if ($env:GITHUB_REPOSITORY -ne 'dfcy-team/dfcy' -or
              $run.path -ne '.github/workflows/developer-a-production-release.yml' -or
              $run.event -ne 'workflow_dispatch' -or $run.head_branch -ne 'main' -or
              $run.head_sha -ne 'fb20a0adb932e07c7d206d05807b80c80076696f' -or
              $run.run_attempt -ne 1 -or $run.status -ne 'completed' -or $run.conclusion -ne 'failure') { throw 'V316 source run identity is invalid.' }
          $required = @{
            'Validate requested release' = 'success'
            'Application quality gates' = 'success'
            'Build immutable CI images' = 'success'
            'Deploy CI digests to production' = 'failure'
          }
          foreach ($name in $required.Keys) {
            $matches = @($jobs.jobs | Where-Object { $_.name -eq $name })
            if ($matches.Count -ne 1 -or $matches[0].status -ne 'completed' -or -not $matches[0].completed_at -or $matches[0].conclusion -ne $required[$name]) {
              throw 'V316 source run required-job conclusions are invalid.'
            }
          }
          $sourceJobRows = @($jobs.jobs)
          if ($jobs.total_count -ne $sourceJobRows.Count -or $sourceJobRows.Count -eq 0) { throw 'V316 source run job listing is incomplete.' }
          $sourceCompletionTimes = @()
          foreach ($job in $sourceJobRows) {
            if ($job.status -ne 'completed') { throw 'V316 source run has a nonterminal job.' }
            if ($job.completed_at) { $sourceCompletionTimes += [DateTimeOffset]::Parse($job.completed_at).UtcDateTime }
            elseif ($job.conclusion -ne 'skipped') { throw 'V316 source run terminal job lacks a completion time.' }
          }
          if ($sourceCompletionTimes.Count -eq 0) { throw 'V316 source run has no verifiable job completion time.' }
          if ($env:GITHUB_RUN_ID -notmatch '^[0-9]{1,20}$' -or $env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Current reuse run identity is invalid.' }
          try { $currentRun = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" -Headers $headers }
          catch { throw 'Unable to verify the current reuse run.' }
          if ($currentRun.path -ne '.github/workflows/developer-a-production-release.yml' -or
              $currentRun.event -ne 'workflow_dispatch' -or $currentRun.head_branch -ne 'main' -or
              $currentRun.head_sha -ne $env:GITHUB_SHA -or $currentRun.run_attempt -ne 1 -or
              $currentRun.status -ne 'in_progress') { throw 'Current reuse run identity is invalid.' }
          $precacheId = '${{ needs.validate.outputs.precache_run_id }}'
          if ($precacheId -notmatch '^[0-9]{1,20}$') { throw 'V316 cache proof run id is invalid.' }
