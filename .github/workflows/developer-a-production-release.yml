          $cacheValidateCompleted = [DateTimeOffset]::Parse($cacheValidateMatches[0].completed_at).UtcDateTime
          $cacheCompleted = [DateTimeOffset]::Parse($cacheActionMatches[0].completed_at).UtcDateTime
          $reuseCreated = [DateTimeOffset]::Parse($currentRun.created_at).UtcDateTime
          if ($cacheCreated -le $sourceCompleted -or $cacheValidateCompleted -le $cacheCreated -or
              $cacheCompleted -le $cacheValidateCompleted -or $cacheCompleted -le $cacheCreated -or
              $reuseCreated -le $cacheCompleted -or ($reuseCreated - $cacheCompleted) -gt [TimeSpan]::FromHours(24)) {
