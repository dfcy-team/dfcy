name: Developer A Production Release

# This workflow creates and publishes immutable CI images. The production VM
# never builds source. The deploy/rollback transport is deliberately separate
# from the server control scripts: the default is dry-run/local checks, and an
# operator must explicitly select ssh on a runner that can reach the private VM.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation to perform'
        type: choice
        required: true
        default: dry_run
        options:
          - dry_run
          - check
          - deploy
          - rollback
          - precache-v316-attempt2
          - deploy-v316-manifest-reuse
          - preflight-v330
          - deploy-v330-manifest-reuse
      transport:
        description: 'Transport for check/deploy/rollback; none performs local gates only'
        type: choice
        required: true
        default: none
        options:
          - none
          - ssh
      release_sha:
        description: 'Full lowercase SHA on main (blank uses the selected workflow commit)'
        required: false
        type: string
      redis_image:
        description: 'Owner-approved immutable Redis digest, required for deploy'
        required: false
        type: string
      rollback_reason:
        description: 'Single-line reason; required for rollback'
        required: false
        type: string
      precache_run_id:
        description: 'Successful V316 pre-cache workflow run; required for manifest reuse'
        required: false
        type: string
      build_run_id:
        description: 'Successful V330 production build-only run; required for V330 preflight and reuse'
        required: false
        type: string
      preflight_run_id:
        description: 'Successful V330 preflight run; required for V330 manifest reuse'
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: saas-collab-production-release
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  CONTROL_DIR: saas-collab-system/deploy/production-control

jobs:
  validate:
    name: Validate requested release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      action: ${{ steps.inputs.outputs.action }}
      transport: ${{ steps.inputs.outputs.transport }}
      release_sha: ${{ steps.inputs.outputs.release_sha }}
      redis_image: ${{ steps.inputs.outputs.redis_image }}
      rollback_reason: ${{ steps.inputs.outputs.rollback_reason }}
      precache_run_id: ${{ steps.inputs.outputs.precache_run_id }}
      build_run_id: ${{ steps.inputs.outputs.build_run_id }}
      preflight_run_id: ${{ steps.inputs.outputs.preflight_run_id }}
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.action == 'deploy-v316-manifest-reuse' && github.sha || inputs.release_sha || github.sha }}
          fetch-depth: 0

      - name: Fetch exact V330 provenance commits
        if: inputs.action == 'preflight-v330' || inputs.action == 'deploy-v330-manifest-reuse'
        shell: bash
        run: |
          set -euo pipefail
          identity=saas-collab-system/deploy/production-control/ci/v330-release-identity.json
          source_sha=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_sha"])' "$identity")
          integration_sha=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["integration_sha"])' "$identity")
          source_pr=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["pull_request_number"])' "$identity")
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$integration_sha" =~ ^[0-9a-f]{40}$ && "$source_pr" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin main "$source_sha"
          git fetch --no-tags origin "refs/pull/$source_pr/head"
          [[ "$(git rev-parse FETCH_HEAD)" == "$integration_sha" ]]

      - name: Validate request and main ancestry
        id: inputs
        shell: bash
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
          REQUESTED_TRANSPORT: ${{ inputs.transport }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
          REQUESTED_REDIS: ${{ inputs.redis_image }}
          REQUESTED_REASON: ${{ inputs.rollback_reason }}
          REQUESTED_PRECACHE_RUN: ${{ inputs.precache_run_id }}
          REQUESTED_BUILD_RUN: ${{ inputs.build_run_id }}
          REQUESTED_PREFLIGHT_RUN: ${{ inputs.preflight_run_id }}
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          action="${REQUESTED_ACTION:-dry_run}"
          transport="${REQUESTED_TRANSPORT:-none}"
          release_sha="${REQUESTED_SHA:-$GITHUB_SHA}"
          case "$action" in dry_run|check|deploy|rollback|precache-v316-attempt2|deploy-v316-manifest-reuse|preflight-v330|deploy-v330-manifest-reuse) ;; *) echo 'Unsupported operation.' >&2; exit 1 ;; esac
          if [[ "$action" = preflight-v330 || "$action" = deploy-v330-manifest-reuse ]]; then
            [[ "$transport" = ssh ]] || { echo 'V330 artifact action requires ssh transport.' >&2; exit 1; }
            [[ -z "${REQUESTED_SHA:-}" ]] || { echo 'V330 artifact action is pinned to configured source identity.' >&2; exit 1; }
            [[ "${REQUESTED_BUILD_RUN:-}" =~ ^[1-9][0-9]{0,19}$ ]] || { echo 'Batch artifact action requires an approved build-only run id.' >&2; exit 1; }
            release_sha="$(python -c 'import json; print(json.load(open("saas-collab-system/deploy/production-control/ci/v330-release-identity.json"))["source_sha"])')"
            if [[ "$action" = deploy-v330-manifest-reuse ]]; then
              [[ "${REQUESTED_PREFLIGHT_RUN:-}" =~ ^[1-9][0-9]{0,19}$ ]] || { echo 'V330 manifest reuse requires a successful preflight run id.' >&2; exit 1; }
            fi
          fi
          if [[ "$action" = precache-v316-attempt2 ]]; then
            [[ "$transport" = ssh ]] || { echo 'V316 pre-cache requires ssh transport.' >&2; exit 1; }
            [[ -z "${REQUESTED_SHA:-}" || "$REQUESTED_SHA" = 'f9827a0a89b622997f1c2633411ec9ef2758839a' ]] || { echo 'V316 pre-cache is pinned to its reviewed release.' >&2; exit 1; }
            release_sha='f9827a0a89b622997f1c2633411ec9ef2758839a'
          fi
          if [[ "$action" = deploy-v316-manifest-reuse ]]; then
            [[ "$transport" = ssh ]] || { echo 'V316 manifest reuse requires ssh transport.' >&2; exit 1; }
            [[ -z "${REQUESTED_SHA:-}" ]] || { echo 'V316 manifest reuse uses its fixed artifact release; release_sha must be blank.' >&2; exit 1; }
            printf '%s' "${REQUESTED_PRECACHE_RUN:-}" | grep -Eq '^[0-9]{1,20}$' || { echo 'V316 manifest reuse requires a successful pre-cache run id.' >&2; exit 1; }
            release_sha='f9827a0a89b622997f1c2633411ec9ef2758839a'
          fi
          case "$transport" in none|ssh) ;; *) echo 'Unsupported transport.' >&2; exit 1 ;; esac
          printf '%s' "$release_sha" | grep -Eq '^[0-9a-f]{40}$' || { echo 'release_sha must be a full lowercase SHA.' >&2; exit 1; }

          if [[ "$action" = preflight-v330 || "$action" = deploy-v330-manifest-reuse ]]; then
            python saas-collab-system/deploy/production-control/ci/batch_provenance.py "$GITHUB_WORKSPACE"
          elif [[ "$action" != rollback ]]; then
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$release_sha" origin/main || { echo 'The requested commit is not reachable from main.' >&2; exit 1; }
          fi

          if [[ "$action" = deploy ]]; then
            [[ "$transport" = ssh ]] || { echo 'deploy requires explicit ssh transport.' >&2; exit 1; }
            printf '%s' "${REQUESTED_REDIS:-}" | grep -Eq '^([A-Za-z0-9._/:@-]+)@sha256:[0-9a-f]{64}$' || { echo 'deploy requires an approved immutable redis_image.' >&2; exit 1; }
          fi
          if [[ "$action" = rollback ]]; then
            [[ "$transport" = ssh ]] || { echo 'rollback requires explicit ssh transport.' >&2; exit 1; }
            [[ -n "${REQUESTED_REASON:-}" && "${REQUESTED_REASON}" != *$'\n'* && "${REQUESTED_REASON}" != *$'\r'* && "${#REQUESTED_REASON}" -le 512 ]] || { echo 'rollback_reason must be a non-empty single line of at most 512 characters.' >&2; exit 1; }
          fi
          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"
          printf 'transport=%s\n' "$transport" >> "$GITHUB_OUTPUT"
          printf 'release_sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
          printf 'redis_image=%s\n' "${REQUESTED_REDIS:-}" >> "$GITHUB_OUTPUT"
          # GITHUB_OUTPUT safely encodes multiline values, but newlines have
          # already been rejected for rollback reasons.
          printf 'rollback_reason=%s\n' "${REQUESTED_REASON:-}" >> "$GITHUB_OUTPUT"
          printf 'precache_run_id=%s\n' "${REQUESTED_PRECACHE_RUN:-}" >> "$GITHUB_OUTPUT"
          printf 'build_run_id=%s\n' "${REQUESTED_BUILD_RUN:-}" >> "$GITHUB_OUTPUT"
          printf 'preflight_run_id=%s\n' "${REQUESTED_PREFLIGHT_RUN:-}" >> "$GITHUB_OUTPUT"

      - name: Static production baseline gate
        run: bash "$CONTROL_DIR/bin/production-baseline-check" --ci --repo-root "$GITHUB_WORKSPACE"

  quality:
    name: Application quality gates
    needs: validate
    if: needs.validate.outputs.action == 'deploy' || needs.validate.outputs.action == 'dry_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: saas-collab-system/backend/requirements.txt
      - name: Backend checks and tests
        working-directory: saas-collab-system/backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DJANGO_SECRET_KEY: production-release-ci-placeholder-secret
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: /tmp/production-release-ci.sqlite3
          REDIS_URL: redis://localhost:6379/15
          CELERY_BROKER_URL: redis://localhost:6379/15
          CELERY_RESULT_BACKEND: redis://localhost:6379/15
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python -m pytest -q
      - name: Frontend locked build
        working-directory: saas-collab-system/frontend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build

  build:
    name: Build immutable CI images
    needs: [validate, quality]
    if: needs.validate.outputs.action == 'deploy' || needs.validate.outputs.action == 'dry_run'
    runs-on: ubuntu-latest
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      migration_sha: ${{ steps.migration.outputs.sha256 }}
      manifest_sha: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR for deploy builds only
        if: needs.validate.outputs.action == 'deploy'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: saas-collab-system/backend
          push: ${{ needs.validate.outputs.action == 'deploy' }}
          tags: ${{ env.IMAGE_PREFIX }}/saas-collab-backend:${{ needs.validate.outputs.release_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.validate.outputs.release_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Build frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: saas-collab-system
          file: saas-collab-system/deploy/pilot/application/Dockerfile.frontend
          push: ${{ needs.validate.outputs.action == 'deploy' }}
          tags: ${{ env.IMAGE_PREFIX }}/saas-collab-frontend:${{ needs.validate.outputs.release_sha }}
          build-args: |
            VITE_API_BASE_URL=
            VITE_USE_MOCK=false
          labels: |
            org.opencontainers.image.revision=${{ needs.validate.outputs.release_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Calculate migration baseline
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          sha256sum_value=$(python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          root = Path('saas-collab-system/backend')
          digest = sha256()
          for path in sorted(root.glob('apps/*/migrations/*.py')):
              digest.update(str(path.relative_to(root)).encode())
              digest.update(path.read_bytes())
          print(digest.hexdigest())
          PY
          )
          printf 'sha256=%s\n' "$sha256sum_value" >> "$GITHUB_OUTPUT"
      - name: Create immutable release manifest
        id: manifest
        if: needs.validate.outputs.action == 'deploy'
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          MIGRATION_SHA: ${{ steps.migration.outputs.sha256 }}
          REDIS_IMAGE: ${{ needs.validate.outputs.redis_image }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'backend build did not produce a digest.' >&2; exit 1; }
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'frontend build did not produce a digest.' >&2; exit 1; }
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = {
              "schema_version": 1,
              "environment": "production",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "git_sha": os.environ["RELEASE_SHA"],
              "backend_image": f"ghcr.io/{os.environ['GITHUB_REPOSITORY']}/saas-collab-backend@{os.environ['BACKEND_DIGEST']}",
              "frontend_image": f"ghcr.io/{os.environ['GITHUB_REPOSITORY']}/saas-collab-frontend@{os.environ['FRONTEND_DIGEST']}",
              "redis_image": os.environ["REDIS_IMAGE"],
              "migration_sha256": os.environ["MIGRATION_SHA"],
              "compose_sha256": "owner-controlled-on-target",
          }
          Path("release-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          manifest_sha=$(sha256sum release-manifest.json | cut -d' ' -f1)
          printf 'sha256=%s\n' "$manifest_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: needs.validate.outputs.action == 'deploy'
        with:
          name: production-release-manifest-${{ needs.validate.outputs.release_sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

  transport-gate:
    name: Require an explicitly reachable deployment transport
    needs: validate
    if: needs.validate.outputs.action == 'deploy' && needs.validate.outputs.transport != 'ssh'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Deployment is intentionally blocked: select ssh on a runner that can reach the private VM.' >&2
          exit 1

  remote-check:
    name: Check the VM control plane
    needs: validate
    if: needs.validate.outputs.action == 'check' && needs.validate.outputs.transport == 'ssh'
    environment: Production
    runs-on: ${{ vars.PRODUCTION_RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      VM_HOST: ${{ vars.VM_HOST }}
      VM_PORT: ${{ vars.VM_PORT }}
      VM_DEPLOY_USER: ${{ vars.VM_DEPLOY_USER }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
    steps:
      - name: Check fixed VM entrypoint without opening a shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VM_HOST -notmatch '^[A-Za-z0-9._:-]+$' -or $env:VM_PORT -notmatch '^[0-9]{1,5}$' -or $env:VM_DEPLOY_USER -notmatch '^[a-z_][a-z0-9_-]{0,31}$') { throw 'Production VM connection variables are invalid.' }
          $key = Join-Path $env:RUNNER_TEMP 'production-ci-key'
          $knownHosts = Join-Path $env:RUNNER_TEMP 'production-known-hosts'
          [IO.File]::WriteAllText($key, $env:VM_SSH_PRIVATE_KEY + "`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText($knownHosts, $env:VM_KNOWN_HOSTS + "`n", [Text.UTF8Encoding]::new($false))
          try {
            & ssh.exe -i $key -p $env:VM_PORT -o BatchMode=yes -o RequestTTY=no -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$knownHosts" -o LogLevel=ERROR "$env:VM_DEPLOY_USER@$env:VM_HOST" check
            if ($LASTEXITCODE -ne 0) { throw 'VM control-plane check failed.' }
          } finally { Remove-Item -LiteralPath $key,$knownHosts -Force -ErrorAction SilentlyContinue }

  remote-deploy:
    name: Deploy CI digests to production
    needs: [validate, build]
    if: needs.validate.outputs.action == 'deploy' && needs.validate.outputs.transport == 'ssh'
    environment: Production
    runs-on: ${{ vars.PRODUCTION_RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      VM_HOST: ${{ vars.VM_HOST }}
      VM_PORT: ${{ vars.VM_PORT }}
      VM_DEPLOY_USER: ${{ vars.VM_DEPLOY_USER }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ github.token }}
      REGISTRY_USER: ${{ github.actor }}
      RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository }}/saas-collab-backend@${{ needs.build.outputs.backend_digest }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/saas-collab-frontend@${{ needs.build.outputs.frontend_digest }}
      REDIS_IMAGE: ${{ needs.validate.outputs.redis_image }}
      MIGRATION_SHA: ${{ needs.build.outputs.migration_sha }}
      MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize sanitized failure receipt
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/saas-collab-system/deploy/production-control/ci/write_failure_receipt.ps1" -Path "$env:GITHUB_WORKSPACE/production-failure-receipt.json" -Stage deploy -Reason unknown -RunId $env:GITHUB_RUN_ID -Attempt $env:GITHUB_RUN_ATTEMPT -ReleaseSha $env:RELEASE_SHA -ControllerSha $env:GITHUB_SHA
      - name: Invoke the fixed forced-command entrypoint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VM_HOST -notmatch '^[A-Za-z0-9._:-]+$' -or $env:VM_PORT -notmatch '^[0-9]{1,5}$' -or $env:VM_DEPLOY_USER -notmatch '^[a-z_][a-z0-9_-]{0,31}$') { throw 'Production VM connection variables are invalid.' }
          if ($env:RELEASE_SHA -notmatch '^[0-9a-f]{40}$' -or $env:MIGRATION_SHA -notmatch '^[0-9a-f]{64}$' -or $env:MANIFEST_SHA -notmatch '^[0-9a-f]{64}$' -or $env:GITHUB_ACTOR -notmatch '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$' -or $env:REGISTRY_USER -notmatch '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$') { throw 'CI release metadata is invalid.' }
          $key = Join-Path $env:RUNNER_TEMP 'production-ci-key'
          $knownHosts = Join-Path $env:RUNNER_TEMP 'production-known-hosts'
          $diagnostic = Join-Path $env:GITHUB_WORKSPACE 'production-failure-receipt.json'
          $receiptHelper = Join-Path $env:GITHUB_WORKSPACE 'saas-collab-system/deploy/production-control/ci/write_failure_receipt.ps1'
          [IO.File]::WriteAllText($key, $env:VM_SSH_PRIVATE_KEY + "`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText($knownHosts, $env:VM_KNOWN_HOSTS + "`n", [Text.UTF8Encoding]::new($false))
          $remote = "deploy --release-sha=$env:RELEASE_SHA --backend-image=$env:BACKEND_IMAGE --frontend-image=$env:FRONTEND_IMAGE --redis-image=$env:REDIS_IMAGE --migration-sha256=$env:MIGRATION_SHA --manifest-sha256=$env:MANIFEST_SHA --actor=$env:GITHUB_ACTOR --registry-user=$env:REGISTRY_USER --registry-token-stdin"
          try {
            $ssh = [Diagnostics.ProcessStartInfo]::new()
            $ssh.FileName = 'ssh.exe'
            $ssh.UseShellExecute = $false
            $ssh.RedirectStandardInput = $true
            foreach ($argument in @('-i', $key, '-p', $env:VM_PORT, '-o', 'BatchMode=yes', '-o', 'RequestTTY=no', '-o', 'StrictHostKeyChecking=yes', '-o', "UserKnownHostsFile=$knownHosts", '-o', 'LogLevel=ERROR', "$env:VM_DEPLOY_USER@$env:VM_HOST", $remote)) {
              [void]$ssh.ArgumentList.Add($argument)
            }
            $ssh.RedirectStandardOutput = $true
            $ssh.RedirectStandardError = $true
            $process = [Diagnostics.Process]::Start($ssh)
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            $process.StandardInput.Write($env:GHCR_TOKEN)
            $process.StandardInput.Close()
            $process.WaitForExit()
            $stdout = $stdoutTask.GetAwaiter().GetResult()
            [void]$stderrTask.GetAwaiter().GetResult()
            if ($process.ExitCode -ne 0) {
              & $receiptHelper -Path $diagnostic -Stage deploy -Reason ssh_exit_nonzero -ExitCode $process.ExitCode -RunId $env:GITHUB_RUN_ID -Attempt $env:GITHUB_RUN_ATTEMPT -ReleaseSha $env:RELEASE_SHA -ControllerSha $env:GITHUB_SHA
              throw 'VM deployment failed.'
            }
            if ($stdout) { [Console]::Out.Write($stdout) }
          } catch {
            if (-not (Test-Path -LiteralPath $diagnostic)) { & $receiptHelper -Path $diagnostic -Stage deploy -Reason unknown -RunId $env:GITHUB_RUN_ID -Attempt $env:GITHUB_RUN_ATTEMPT -ReleaseSha $env:RELEASE_SHA -ControllerSha $env:GITHUB_SHA }
            throw
          } finally { Remove-Item -LiteralPath $key,$knownHosts -Force -ErrorAction SilentlyContinue }
      - name: Preserve sanitized production failure receipt
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-diagnostic
          path: production-failure-receipt.json
          if-no-files-found: ignore
          retention-days: 30


  precache-v316-attempt2:
    name: Cache exact V316 attempt-2 images (no deployment)
    needs: validate
    if: needs.validate.outputs.action == 'precache-v316-attempt2' && needs.validate.outputs.transport == 'ssh'
    environment: Production
    runs-on: ${{ vars.PRODUCTION_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      VM_HOST: ${{ vars.VM_HOST }}
      VM_PORT: ${{ vars.VM_PORT }}
      VM_DEPLOY_USER: ${{ vars.VM_DEPLOY_USER }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.PRODUCTION_GHCR_PULL_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize sanitized failure receipt
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/saas-collab-system/deploy/production-control/ci/write_failure_receipt.ps1" -Path "$env:GITHUB_WORKSPACE/production-failure-receipt.json" -Stage cache -Reason unknown -RunId $env:GITHUB_RUN_ID -Attempt $env:GITHUB_RUN_ATTEMPT -ReleaseSha 'f9827a0a89b622997f1c2633411ec9ef2758839a' -ControllerSha $env:GITHUB_SHA
      - name: Download exact existing manifest (no build)
        uses: actions/download-artifact@v4
        with:
          name: production-release-manifest-f9827a0a89b622997f1c2633411ec9ef2758839a
          run-id: 40515060731
          github-token: ${{ github.token }}
      - name: Verify exact manifest identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'release-manifest.json'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $manifest).Hash.ToLowerInvariant() -ne '3d437f40b274a4e12846691c31337bc69f052f31d344cfb9aba7869cd952097d') { throw 'V316 manifest bytes differ.' }
          $m = Get-Content -Raw -LiteralPath $manifest | ConvertFrom-Json
          if ($m.git_sha -ne 'f9827a0a89b622997f1c2633411ec9ef2758839a' -or
              $m.backend_image -ne 'ghcr.io/dfcy-team/dfcy/saas-collab-backend@sha256:6a943d02b598a7033a24f9c94ef8ed9d5580acaccc13143b6650e74de2669236' -or
              $m.frontend_image -ne 'ghcr.io/dfcy-team/dfcy/saas-collab-frontend@sha256:de99b6e2e1dcebf6079ad20b3af25a24004feaae4a43279c3f538f08cd9aefa8' -or
              $m.redis_image -ne 'redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99' -or
              $m.migration_sha256 -ne 'ec7711ad6f8e37608fba55997e5883155145371773342d5d96022a79f1e21557') { throw 'V316 artifact identity differs.' }
      - name: Invoke fixed cache-only command with GHCR token on stdin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VM_HOST -notmatch '^[A-Za-z0-9._:-]+\z' -or $env:VM_PORT -notmatch '^[0-9]{1,5}\z' -or $env:VM_DEPLOY_USER -notmatch '^[a-z_][a-z0-9_-]{0,31}\z' -or $env:GITHUB_ACTOR -notmatch '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}\z' -or $env:GITHUB_SHA -notmatch '^[0-9a-f]{40}\z' -or $env:GITHUB_RUN_ID -notmatch '^[0-9]{1,20}\z' -or $env:GITHUB_RUN_ATTEMPT -ne '1') { throw 'Pre-cache transport identity is invalid.' }
          $key = Join-Path $env:RUNNER_TEMP 'production-ci-key'
          $knownHosts = Join-Path $env:RUNNER_TEMP 'production-known-hosts'
          $diagnostic = Join-Path $env:GITHUB_WORKSPACE 'production-failure-receipt.json'
          $receiptHelper = Join-Path $env:GITHUB_WORKSPACE 'saas-collab-system/deploy/production-control/ci/write_failure_receipt.ps1'
          $remote = "precache-v316-attempt2 --cache-controller-sha=$env:GITHUB_SHA --registry-user=$env:GITHUB_ACTOR"
          try {
            [IO.File]::WriteAllText($key, $env:VM_SSH_PRIVATE_KEY + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($knownHosts, $env:VM_KNOWN_HOSTS + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
            $cacheSsh = [Diagnostics.ProcessStartInfo]::new()
            $cacheSsh.FileName = 'ssh.exe'
            $cacheSsh.UseShellExecute = $false
            $cacheSsh.RedirectStandardInput = $true
            $cacheSsh.RedirectStandardOutput = $true
            $cacheSsh.RedirectStandardError = $true
            foreach ($argument in @('-i', $key, '-p', $env:VM_PORT, '-o', 'BatchMode=yes', '-o', 'RequestTTY=no', '-o', 'StrictHostKeyChecking=yes', '-o', "UserKnownHostsFile=$knownHosts", '-o', 'LogLevel=ERROR', "$env:VM_DEPLOY_USER@$env:VM_HOST", $remote)) {
