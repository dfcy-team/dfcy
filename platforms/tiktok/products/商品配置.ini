; ============================================================
; 商品管理专用配置（与 导入总配置.ini 分开，单独运行时用）
; 改完保存 → 到 正式环境\商品管理 目录运行对应 bat
; 可用命令行 --shop TK6PH 临时覆盖 [common] shop
; ============================================================

[common]
; 当前操作店铺（对应 店铺配置\config_<shop>.env）
shop = TK6PH

; 1=只预览不写 API  0=真实调用
dry_run = 0


[query]
; 商品查询：留空=全部状态
status =
page_size = 10
max_pages = 2


[price]
; 产品改价 — 运行「运行产品改价.bat」
product_id =
sku_id =
amount = 99.00


[product_listing]
; 商品上下架 — 运行「运行上下架.bat」
product_id =


[sku_listing]
; SKU 上架（含库存）— 运行 run_sku_activate.bat
product_id =
sku_id =
warehouse_id =
quantity = 5
activate_product = 1


[inventory]
; 改库存 — 运行「运行改库存.bat」
product_id =
sku_id =
warehouse_id =
quantity = 10


[create]
; 创建商品 — 运行 run_create.bat
dry_run = 1
auto_activate = 0
title = API Test Product
description = <p>English description for PH shop.</p>
category_id = 810376
brand_id =
main_image_uri =
image_path = samples/main.jpg
sub_image_paths = samples/sub1.jpg;samples/sub2.jpg
image_use_case = MAIN_IMAGE
attributes_json = create_attrs.json
sales_attributes_json =
skus_json = create_skus.json
seller_sku = API-TEST-001
price = 99.00
quantity = 5
warehouse_id =
save_mode = AS_DRAFT
is_cod_allowed = 1
delivery_option_ids =
package_length = 10
package_width = 10
package_height = 5
package_weight = 0.3


[excel_create]
; Excel 批量创建 — 运行 run_excel_create.bat
; Excel 默认在桌面：TikTok商品批量创建模板.xlsx
excel_path = C:\Users\Administrator\Desktop\TikTok商品批量创建模板.xlsx
dry_run = 1
sheet_name =
start_row = 4
max_rows = 0
