; 订单导出参数 — 用记事本打开修改，保存后双击「运行导出订单.bat」
; 日期格式：YYYY-MM-DD（按当前店铺所在国家当地时间，非 UTC）
; 国家来自 config 的 TTS_TARGET_REGION 或店键后缀，如 TK2PH=菲律宾，TK1TH=泰国

[订单导出]
开始日期=2026-05-25
结束日期=2026-05-25

; 留空=全部状态。可选：UNPAID / AWAITING_SHIPMENT / AWAITING_COLLECTION / IN_TRANSIT / DELIVERED / COMPLETED / CANCELLED
订单状态=

每页条数=100
全部导出=是
导出Excel=是
保存JSON=否

; 控制台只打印前几条摘要（0=不打印列表，避免刷屏）
控制台摘要条数=10
