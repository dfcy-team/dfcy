; 流水分析参数 — 用记事本修改，保存后双击「运行流水分析.bat」
; 日期按当前店铺国家当地时间（PH/TH/MY，见店铺键或 config 里 TTS_TARGET_REGION）

[流水导出]
; 留空则用 正式环境\店铺配置\CURRENT_SHOP.txt；可填 TK1PH / TK2PH
店铺键=TK2PH

开始日期=2026-05-25
结束日期=2026-05-25

; 开始/结束都留空时，用「最近天数」（从今天当地日期往前推）
最近天数=30

; 导出类型: all / statements / transactions / payments / withdrawals / unsettled
导出类型=all

每页条数=50
全部翻页=是
导出Excel=是
保存JSON=否

; 只拉前 N 个结算单的明细流水，0=全部结算单
结算单流水上限=0
