; ============================================================
; 每日定时跑店铺罗盘（产品 + SKU → Z 盘 + MySQL）
; 安装: 双击 tools\安装每日定时任务.bat
; 手动试跑: launch\daily_analytics.bat
; ============================================================

[定时]
; Windows 计划任务名称
任务名称 = TikTok_API_每日罗盘

; 每天执行时刻（24 小时制，本机 Windows 时间）
执行时间 = 00:05

; 跑几天前的完整日数据（按下面时区「今天」往前数）
; 1=昨天  2=前天  3=大前天
往前天数 = 2

; 手动固定某一天（留空=用往前天数）；填了则每次定时都跑这一天
固定日期 =

; 计算「往前天数」用的时区（店铺分析 API 仍按各店 PH/TH/MY）
时区 = Asia/Manila

; 每次运行日志目录（相对项目根）
日志目录 = logs\daily

[执行内容]
; 批量配置（产品+SKU+入库 读 导入总配置.ini）
配置 = config\导入总配置.ini

; 店铺列表读 config\运行店铺.ini（导入总配置 启用店铺=runlist）
; 要改跑哪些店 → 编辑 运行店铺.ini
