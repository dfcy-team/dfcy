; ============================================================
; TikTok_API 总配置 — 批量导入旧版本目录
; 店铺 env 在：platforms\tiktok\shop\config_*.env
; ============================================================

[全局]
店铺配置目录 = platforms\tiktok\shop

; 查询日期: 写 YYYY-MM-DD 固定一天；auto=按「往前天数」自动算（推荐定时/批量）
查询日期 = auto

; 往前天数（查询日期=auto 时生效；与 定时任务.ini 一致，改一处即可）
; 1=昨天  2=前天  3=大前天
往前天数 = 2
统计时区 = Asia/Manila
固定日期 =

; 启用店铺：runlist=读 config/运行店铺.ini（推荐，留空则不跑）
; 也可直接写: TK1PH,TK2PH,TKKJ1PH
启用店铺 = runlist

导入根目录 = C:\Users\Administrator\Desktop\旧版本\TikTok_API
自动导入 = 是
跳过已存在 = 否
导入数据库 = 否
导出Excel = 是
保存缓存 = 是
本地日志目录 = logs


[店铺罗盘API]
启用 = 是
; 只跑产品+SKU（视频不入库、不拉 API）
数据类型 = 产品, SKU，视频
拉视频详情 = 是
复制到API接口目录 = 是
; 全部 API 下载统一落在 旧版本\TikTok_API\店铺分析API接口\ 下（与流水、订单一致）
产品目录 = 根目录\店铺分析API接口\产品数据表
SKU目录 = 根目录\店铺分析API接口\商品sku信息
视频目录 = 根目录\店铺分析API接口\视频自营明细
产品_API目录 = 根目录\店铺分析API接口\产品数据表
SKU_API目录 = 根目录\店铺分析API接口\商品sku信息
视频_API目录 = 根目录\店铺分析API接口\视频自营明细
产品_JSON目录 = 根目录\店铺分析API接口\json缓存\产品
SKU_JSON目录 = 根目录\店铺分析API接口\json缓存\商品sku信息
视频_JSON目录 = 根目录\店铺分析API接口\json缓存\视频自营明细
店铺数据目录 = 根目录\店铺分析API接口\店铺数据
脚本 = platforms\tiktok\analytics\店铺分析.py
日志目录 = platforms\tiktok\analytics\logs


[店铺流水]
启用 = 是
; Excel 文件名含店名: TIKTOK4号店PH_结算单流水_开始_结束.xlsx
; 旧版本目录: C:\Users\Administrator\Desktop\旧版本\TikTok_API\店铺分析API接口\结算单|结算单流水|付款记录|提现流水\
数据类型 = 结算单, 结算明细, 付款, 提现
结算单目录 = 根目录\店铺分析API接口\结算单
结算明细目录 = 根目录\店铺分析API接口\结算单流水
付款目录 = 根目录\店铺分析API接口\付款记录
提现目录 = 根目录\店铺分析API接口\提现流水
未结算目录 = 根目录\店铺分析API接口\未结算
流水_JSON目录 = 根目录\店铺分析API接口\json缓存\店铺流水
脚本 = platforms\tiktok\finance\流水分析.py
日志目录 = platforms\tiktok\finance\logs


[订单]
启用 = 是

; 留空=全部状态
订单状态 =

全部翻页 = 是
订单目录 = 根目录\店铺分析API接口\订单数据表
订单_JSON目录 = 根目录\店铺分析API接口\json缓存\订单数据表
脚本 = platforms\tiktok\orders\订单查询.py
日志目录 = platforms\tiktok\orders
