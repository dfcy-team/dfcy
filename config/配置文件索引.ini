; ============================================================
; TikTok_API 全部配置文件索引
; ============================================================

[店铺_token]
文件 = config\店铺配置.ini
env目录 = platforms\tiktok\shop\

[批量导入_Z盘]
文件 = config\导入总配置.ini

[每日定时_00点05]
文件 = config\定时任务.ini
安装 = tools\安装每日定时任务.bat
手动 = launch\daily_analytics.bat

[广告户定时刷新]
文件 = config\广告定时刷新.ini
说明 = 网站启动后内置调度，默认每天 00:05、22:05（Asia/Manila）自动刷新
手动 = launch\refresh_ads_advertisers.bat

[本次运行店铺]
文件 = config\运行店铺.ini
说明 = 只跑这里填写的店，留空则不跑

[商品管理_单独跑]
文件 = platforms\tiktok\products\商品配置.ini

[订单_单店导出]
文件 = platforms\tiktok\orders\导入配置.ini

[数据分析_仅罗盘]
文件 = batch\analytics\导入配置.ini

[流水_仅流水]
文件 = batch\finance\导入配置.ini

[订单_批量]
文件 = batch\orders\导入配置.ini
