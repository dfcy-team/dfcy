; ============================================================
; 每日自动刷新 TikTok 广告户列表（卖家中心默认户同步）
; 安装: 双击 tools\安装广告刷新定时任务.bat
; 手动试跑: launch\refresh_ads_advertisers.bat
; ============================================================

[定时]
; Windows 计划任务名称前缀（会创建 _凌晨 / _晚间 两个任务）
任务名称 = TikTok_API_广告户刷新

; 凌晨刷新（24 小时制，本机 Windows 时间）
凌晨执行时间 = 00:05

; 晚间再刷新一次（留空=不创建晚间任务）
晚间执行时间 = 22:05

; 日志目录（相对项目根）
日志目录 = logs\ads_refresh

[Web服务]
; 网站常驻运行时，是否在进程内按上述时刻自动刷新（1=是 0=否）
; 若已安装 Windows 计划任务，建议保持 0，避免重复刷新
启用内置调度 = 0
