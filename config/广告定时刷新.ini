; ============================================================
; 广告户列表自动刷新（网站内置调度，启动网站后自动生效）
; 手动试跑: launch\refresh_ads_advertisers.bat
; ============================================================

[定时]
; 凌晨刷新（24 小时制，按下面时区）
凌晨执行时间 = 00:05

; 晚间再刷新一次（留空=只刷凌晨）
晚间执行时间 = 22:05

; 执行时刻所用时区（与店铺罗盘定时一致）
时区 = Asia/Manila

; 日志目录（相对项目根）
日志目录 = logs\ads_refresh

[Web服务]
; 网站进程内置调度：1=启用（默认） 0=关闭
启用内置调度 = 1
