; ============================================================
; TikTok_API 店铺 env 总配置（全平台店铺简称 + 导出标签）
; shop_abbr -> shop_name(导出标签); site 由简称后缀 PH/TH/MY 解析
; ============================================================

[应用]
app_env = platforms\tiktok\shop\app.env
app_key = 6k2of5545ns13
redirect_url = https://dingfengchuangyu.top/callback

[目录]
店铺配置目录 = platforms\tiktok\shop
shops_json = platforms\tiktok\shop\shops.json
env模板 = platforms\tiktok\shop\_template.env

[默认店]
当前店 = TKKJ5PH

[批量启用]
; 已改用 config/运行店铺.ini，此处可留空
启用店铺 =

[导出文件名]
产品表 = 产品数据表
SKU表 = 商品sku信息
视频表 = 视频自营明细
订单表 = 订单数据表
店铺表 = 店铺数据
结算单 = 结算单
结算明细 = 结算单流水
付款 = 付款记录
提现 = 提现流水
未结算 = 未结算

