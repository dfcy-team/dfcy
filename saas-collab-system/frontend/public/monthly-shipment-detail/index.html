<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>供应商发货单详情</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:1400px;margin:auto;background:#fff;border:1px solid #dce4ef;border-radius:12px;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{margin:0;font-size:22px}h2{font-size:16px;margin:24px 0 10px}p{color:#5a6679}button,.link{border:1px solid #ccd7e5;background:#fff;color:#2457c5;border-radius:6px;padding:8px 12px;cursor:pointer;text-decoration:none}.status{padding:10px 12px;margin:14px 0;border-radius:6px;background:#eff6ff;color:#1d4ed8}.status.error{background:#fff0f0;color:#b42318}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}.metric{background:#f3f6fb;padding:12px;border-radius:7px}.metric small,.metric strong{display:block}.metric strong{margin-top:7px;font-variant-numeric:tabular-nums}.meta{display:flex;gap:18px;flex-wrap:wrap}.table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:7px}table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid #e5eaf1;text-align:left;vertical-align:top}th{background:#f7f9fc;color:#465469;white-space:nowrap}td.num{text-align:right;font-variant-numeric:tabular-nums}.tag{display:inline-block;border-radius:12px;padding:2px 8px;background:#eef2ff;color:#3349a6}.late{color:#b45309}.muted{color:#778397}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.card{border:1px solid #e2e8f0;border-radius:8px;padding:12px}.card h3{margin:0 0 8px;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){body{padding:8px}main{padding:14px}}
</style></head><body><main>
<header><div><h1 id="title">供应商发货单详情</h1><p id="subtitle"></p></div><div class="actions"><button id="refresh">刷新</button><button id="back">返回月份对账</button></div></header>
<div id="status" class="status">正在读取发货单…</div><div id="content" hidden>
<div id="meta" class="meta"></div><section class="metrics" id="metrics"></section>
<h2>关联采购单</h2><div id="orders" class="actions"></div>
<h2>集货、运输与入库</h2><div id="batches" class="cards"></div>
<h2>发货明细与入库差异</h2><div class="table-wrap"><table><thead><tr><th>SKU</th><th>商品</th><th>单价</th><th>发货数量</th><th>应收数量</th><th>累计实收</th><th>待到数量</th><th>差异数量</th><th>差异金额</th><th>进度 / 说明</th></tr></thead><tbody id="lines"></tbody></table></div>
<h2>付款与凭证</h2><div class="table-wrap"><table><thead><tr><th>付款日期</th><th>付款类型</th><th>来源单号</th><th>原付款总额</th><th>本单登记金额</th><th>参考号</th><th>备注</th><th>凭证</th></tr></thead><tbody id="payments"></tbody></table></div>
<h2>国内运费</h2><div class="metrics" id="domestic"></div><div class="table-wrap"><table><thead><tr><th>付款日期</th><th>付款方式</th><th>单据金额</th><th>付款金额</th><th>凭证</th></tr></thead><tbody id="domesticPayments"></tbody></table></div>
<h2>清点差额处置</h2><div class="table-wrap"><table><thead><tr><th>源采购单</th><th>源发货单</th><th>差额</th><th>处置方式</th><th>净差金额</th><th>说明</th><th></th></tr></thead><tbody id="choices"></tbody></table></div>
</div></main><script>
(()=>{const q=new URLSearchParams(location.search),shipmentId=q.get('shipment_id'),month=q.get('month'),status=document.querySelector('#status'),content=document.querySelector('#content');const sessionKey='saas-collab.auth.session.v1',membershipKey='saas-collab.active-membership.v1';
const session=()=>{try{return JSON.parse(sessionStorage.getItem(sessionKey)||'{}')}catch{return {}}};const headers=()=>{const s=session(),h={};if(s.access)h.Authorization='Bearer '+s.access;const m=sessionStorage.getItem(membershipKey);if(s.access&&/^\d+$/.test(m||''))h['X-Org-Membership']=m;return h};
const el=(tag,text,cls)=>{const n=document.createElement(tag);n.textContent=text??'';if(cls)n.className=cls;return n},money=v=>v==null?'待核对':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:4}),value=(v)=>v==null||v===''?'—':v;
function safeLink(label,href){const a=el('a',label,'link');a.href=href;a.target='_blank';a.rel='noopener';a.addEventListener('click',e=>{e.preventDefault();const w=window.open('about:blank','_blank');if(!w)return;w.opener=null;w.location.href=href});return a}
function emptyRow(parent,cols,message){if(parent.children.length)return;const tr=document.createElement('tr'),td=el('td',message,'muted');td.colSpan=cols;tr.append(td);parent.append(tr)}
function metric(parent,label,v){const box=el('div',null,'metric');box.append(el('small',label),el('strong',money(v)));parent.append(box)}
function row(parent,values){const tr=document.createElement('tr');for(const [v,cls] of values)tr.append(el('td',value(v),cls));parent.append(tr)}
async function request(url){const r=await fetch(url,{headers:headers()});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||d.detail||'请求失败 ('+r.status+')');return d.data?.data??d.data??d}
async function voucher(file){try{const r=await fetch(file.download_path,{headers:headers()});if(!r.ok)throw Error('凭证下载失败');const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=file.file_name||'付款凭证';a.click();URL.revokeObjectURL(u)}catch(e){show(e.message,true)}}
function show(msg,error=false){status.hidden=false;status.textContent=msg;status.className='status'+(error?' error':'')}
function render(d){const s=d.shipment,a=d.amounts;document.querySelector('#title').textContent=s.number+' · 供应商发货单';document.querySelector('#subtitle').textContent='源单号 '+s.source_number+' · 对账月份 '+d.period.month+' · 月末 '+d.period.cutoff_date;const meta=document.querySelector('#meta');meta.replaceChildren(el('span','供应商 '+s.supplier),el('span','发货日期 '+s.date));const ms=document.querySelector('#metrics');ms.replaceChildren();[['发货货款',a.goods_amount],['历史已付',a.historical_paid],['月初前现金付款',a.cash_before_month],['本月现金付款',a.cash_in_month],['定金抵扣',a.prepayment_applied],['月末剩余应付',a.remaining_at_cutoff],['当前剩余应付',a.remaining_current]].forEach(x=>metric(ms,...x));
const orders=document.querySelector('#orders');orders.replaceChildren();(s.purchase_orders||[]).forEach(o=>{orders.append(safeLink(o.number+' · '+o.order_date,'/supply-chain/purchase-orders?order_id='+encodeURIComponent(o.id)))});if(!orders.children.length)orders.append(el('span','没有关联采购单','muted'));
const batches=document.querySelector('#batches');batches.replaceChildren();(d.batches||[]).forEach(b=>{const c=el('details',null,'card');const sum=el('summary',b.number+' · '+(b.freight_number||'无海运单号')+' · 柜号 '+(b.container_number||'—'));c.append(sum);c.append(el('p','运输阶段 '+(b.stage||'—')+' · 发运 '+(b.departed_at||'—')+' · 到仓 '+(b.arrived_warehouse_at||'—')));c.append(safeLink('打开集货发运单','/supply-chain/logistics?batch_id='+encodeURIComponent(b.id)));const alloc=document.createElement('ul');(b.allocations||[]).forEach(a=>{const line=(s.lines||[]).find(x=>x.id===a.shipment_line_id)||{};const inboundLines=b.inbound?.lines||[];const rec=inboundLines.find(x=>x.shipment_line_id===a.shipment_line_id);alloc.append(el('li',(line.sku||'')+' · 本柜分配 '+a.quantity+' · 本柜实收 '+(rec?.received_quantity??'待清点')))});if(!alloc.children.length)alloc.append(el('li','本单暂无该柜分配明细','muted'));c.append(alloc);if(b.inbound){c.append(safeLink('入库单 '+b.inbound.number,'/supply-chain/logistics?inbound_id='+encodeURIComponent(b.inbound.id)));c.append(el('p',b.inbound.warehouse+' · '+(b.inbound.confirmed_at||b.inbound.status)));if(b.inbound.after_cutoff)c.append(el('p','月末后入库','late'));if(b.inbound.receipt_reference)c.append(el('p','收货引用 '+b.inbound.receipt_reference));}else c.append(el('p','尚无关联入库单','muted'));batches.append(c)});if(!batches.children.length)batches.append(el('p','暂无关联集货或入库记录','muted'));
const lines=document.querySelector('#lines');lines.replaceChildren();(s.lines||[]).forEach(x=>row(lines,[[x.sku],[x.product_name],[money(x.unit_price),'num'],[x.shipped_quantity,'num'],[x.expected_quantity,'num'],[x.received_quantity,'num'],[x.pending_quantity,'num'],[x.difference_quantity,'num'],[x.difference_amount?money(x.difference_amount):'—','num'],[(x.progress_label||'')+' '+(x.difference_notes||[]).join('；')]]));
const payments=document.querySelector('#payments');payments.replaceChildren();(d.payments||[]).forEach(x=>{const tr=document.createElement('tr');[x.date,x.source+(x.reverses_id?'（冲销）':''),x.source_number,money(x.source_amount),money(x.amount),x.reference_number,x.notes].forEach(v=>tr.append(el('td',value(v))));const td=document.createElement('td');(x.vouchers||[]).forEach(f=>{const b=el('button',f.file_name||'下载凭证');b.onclick=()=>voucher(f);td.append(b)});if(x.after_cutoff)td.append(el('span','月末后付款','late'));tr.append(td);payments.append(tr)});
const dom=d.domestic_freight||{},dm=document.querySelector('#domestic');dm.replaceChildren();const mode=el('div',null,'metric');mode.append(el('small','付款归属'),el('strong',dom.mode_label||'未标注'));dm.append(mode);[['应付金额',dom.due_amount],['已付金额',dom.paid_amount],['剩余应付',dom.remaining_amount]].forEach(([k,v])=>metric(dm,k,v));const dp=document.querySelector('#domesticPayments');dp.replaceChildren();(dom.payments||[]).forEach(x=>{const tr=document.createElement('tr');[x.date,x.source+(x.reverses_id?'（冲销）':''),money(x.source_amount),money(x.amount)].forEach(v=>tr.append(el('td',value(v))));const td=document.createElement('td');(x.vouchers||[]).forEach(f=>{const b=el('button',f.file_name||'下载凭证');b.onclick=()=>voucher(f);td.append(b)});tr.append(td);dp.append(tr)});
const choices=document.querySelector('#choices');choices.replaceChildren();(d.difference_choices||[]).forEach(x=>{const tr=document.createElement('tr');[x.source_purchase,x.source_shipment,money(x.amount),x.option_label,money(x.net_difference_amount),x.notes].forEach(v=>tr.append(el('td',value(v))));const td=document.createElement('td');if(x.href){const a=el('a','查看处置','link');a.href=x.href;td.append(a)}tr.append(td);choices.append(tr)});emptyRow(lines,10,'暂无发货或入库明细');emptyRow(payments,8,'暂无付款记录');emptyRow(dp,5,'暂无国内运费付款记录');emptyRow(choices,7,'暂无清点差额处置记录');
content.hidden=false;status.hidden=true}
async function load(){if(!shipmentId||!month){show('缺少发货单或月份参数。',true);return}show('正在读取发货单…');try{const data=await request('/api/internal/supply-chain/v2/monthly-payables/shipment-drilldown/?shipment_id='+encodeURIComponent(shipmentId)+'&month='+encodeURIComponent(month));render(data)}catch(e){show(e.message||'读取失败',true)}}
document.querySelector('#refresh').onclick=load;document.querySelector('#back').onclick=()=>parent.postMessage({type:'close-monthly-shipment'},location.origin);load()})();
</script></body></html>
