{% extends "base.html" %}
{% block title %}授权回调 · {{ brand }}{% endblock %}
{% block content %}
<h1>授权处理中</h1>

{% if error %}
<div class="card alert">
  <h2>授权未成功</h2>
  <p>授权被拒绝或已取消，请返回重新授权。</p>
  <p><a class="btn primary" href="{{ url_for('authorize_page') }}">返回授权页</a></p>
</div>
{% elif code %}
<div class="card ok">
  <h2>授权已收到</h2>
  <p>系统正在保存授权信息，请稍候…</p>
  <p class="muted">若未自动跳转，请返回 <a href="{{ url_for('authorize_page') }}">店铺授权</a> 页查看状态。</p>
  <p><a class="btn primary" href="{{ url_for('dashboard') }}">前往数据导出</a></p>
</div>
{% else %}
<div class="card">
  <p>请从 <a href="{{ url_for('authorize_page') }}">店铺授权</a> 页发起 TikTok 授权。</p>
</div>
{% endif %}
{% endblock %}
